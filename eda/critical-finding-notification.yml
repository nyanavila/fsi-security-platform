---
# launch-notification-via-api.yml
#
# Called by the rulebook's run_playbook action (NOT run_job_template,
# which is broken on this AAP 2.7 instance -- job_template_runner hits
# the legacy /api/v2/config/ path, which 404s; confirmed the real path is
# /api/controller/v2/, but that's hardcoded in ansible-rulebook's own code,
# not something a credential field can override).
#
# This sidesteps the broken auto-discovery entirely by doing a plain HTTP
# POST to the confirmed-correct launch endpoint directly.

- name: Launch AAP job template via confirmed-correct API path
  hosts: localhost
  gather_facts: false

  tasks:
    - name: POST to the job template's launch endpoint
      ansible.builtin.uri:
        url: "https://ip-10-0-1-211.us-east-2.compute.internal/api/controller/v2/job_templates/{{ target_job_template_id }}/launch/"
        method: POST
        user: "{{ aap_api_user }}"
        password: "{{ aap_api_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          extra_vars: "{{ launch_extra_vars | default({}) }}"
        status_code: [200, 201, 202]
      register: launch_result

    - name: Confirm
      ansible.builtin.debug:
        msg: "Launched job template {{ target_job_template_id }}, job id: {{ launch_result.json.job | default('unknown') }}"
