---
# AI-generated executive compliance summary.
# Pulls Satellite compliance data + AAP job history, feeds it to an LLM,
# produces a one-page plain-language summary for non-technical stakeholders.
#
# This directly addresses the gap flagged in the FSI security fit-analysis:
# "everything produced today is for engineers, nothing for the board/auditor."
#
# Model backend: this playbook is written against Anthropic's API directly
# (simplest to stand up for a demo). If you have Ansible Lightspeed's chatbot
# configured with a model backend already, swap the "Call LLM" task to call
# that endpoint instead — same shape, different URL/auth.

- name: Generate executive compliance summary
  hosts: localhost
  gather_facts: true
  vars:
    satellite_url: "https://ip-10-0-1-135.us-east-2.compute.internal"
    report_date: "{{ ansible_date_time.date }}"

  tasks:
    - name: Get compliance policy list
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/compliance/policies"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: policies

    - name: Get all hosts with compliance status
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/hosts?include_permissions=false&per_page=100"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: all_hosts

    - name: Get recent AAP job history (last 7 days)
      ansible.builtin.uri:
        url: "https://localhost:443/api/controller/v2/jobs/?created__gte={{ (ansible_date_time.epoch | int - 604800) | to_datetime('%s') }}&order_by=-created"
        method: GET
        user: "{{ aap_user | default('admin') }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: recent_jobs
      ignore_errors: true  # non-fatal if AAP API shape differs; summary still useful without it

    - name: Build the raw data payload for the LLM
      ansible.builtin.set_fact:
        raw_data_summary: |
          Compliance Policies: {{ policies.json.results | length }} active policies
          {% for p in policies.json.results %}
          - {{ p.name }}: deployed via {{ p.deploy_by | default('unknown') }}
          {% endfor %}

          Total Managed Hosts: {{ all_hosts.json.total | default(all_hosts.json.results | length) }}

          Recent Automation Activity (last 7 days):
          {% if recent_jobs.json is defined %}
          - {{ recent_jobs.json.count | default(0) }} jobs run
          - {{ recent_jobs.json.results | default([]) | selectattr('status', 'equalto', 'failed') | list | length }} failed
          - {{ recent_jobs.json.results | default([]) | selectattr('status', 'equalto', 'successful') | list | length }} successful
          {% else %}
          - Job history unavailable this run
          {% endif %}

          Report generated: {{ report_date }}

    - name: Call LLM to generate the executive summary
      ansible.builtin.uri:
        url: "https://api.anthropic.com/v1/messages"
        method: POST
        headers:
          x-api-key: "{{ anthropic_api_key }}"
          anthropic-version: "2023-06-01"
          Content-Type: "application/json"
        body_format: json
        body:
          model: "claude-sonnet-4-6"
          max_tokens: 1000
          messages:
            - role: "user"
              content: >-
                You are writing a one-page executive compliance summary for a bank's
                board and risk committee, based on this raw infrastructure data. Write
                in plain, non-technical language. Structure it as: (1) Overall posture
                in one sentence, (2) What's working, (3) What needs attention, with
                specific numbers, (4) One clear recommended action if any findings need
                escalation. Do not use jargon like "OpenSCAP" or "ARF" — translate to
                plain terms like "automated security scan." Keep it under 300 words.

                Raw data:
                {{ raw_data_summary }}
        status_code: [200]
      register: llm_response
      no_log: false  # set true in production to avoid logging the API key

    - name: Extract and save the executive summary
      ansible.builtin.copy:
        content: |
          # Executive Compliance Summary
          **Generated:** {{ report_date }}
          **For:** Board Risk Committee / Executive Stakeholders

          ---

          {{ llm_response.json.content[0].text }}

          ---
          *This summary was generated by an LLM from live Satellite and AAP data.
          It is a communication aid, not a substitute for the underlying technical
          compliance records, which remain the authoritative source. See the
          detailed remediation matrix and Satellite Compliance dashboard for
          full technical detail.*
        dest: "/tmp/executive_compliance_summary_{{ report_date }}.md"
      delegate_to: localhost

    - name: Display the summary
      ansible.builtin.debug:
        msg: "{{ lookup('file', '/tmp/executive_compliance_summary_' + report_date + '.md').split('\n') }}"
