---
# fsi-errata-rulebook.yml (v3 -- final, using CONFIRMED official syntax)
#
# Condition syntax confirmed against the OFFICIAL ansible-rulebook docs
# (github.com/ansible/ansible-rulebook/docs/conditions.rst), which shows
# this EXACT pattern for "match any one attribute from a single event":
#
#   condition: event.version == "2.0" or event.version == "1.1"
#
# A bare "or" between two equality checks, NO parentheses, NO "is defined"
# guards. This is simpler than every version tried earlier today, and it's
# now based on the documented example, not inference.
#
# Architecture (confirmed working today):
#   - Satellite native webhook -> AAP Event Stream -> this rulebook
#   - action: run_job_template (the officially documented, simplest action)
#   - Controller credential Host must include /api/controller path segment
#     (confirmed fix for the earlier 404), auth must be valid admin creds

- name: FSI errata job outcome triage
  hosts: all

  sources:
    - name: local_test_source
      ansible.eda.generic:
        payload: []

  rules:
    - name: Log all incoming job outcome events
      condition: event.payload is defined
      action:
        debug:
          msg: "Received event: {{ event.payload }}"

    - name: Escalate failed errata install
      condition: >-
        event.payload.event_name == "actions.remote_execution.run_hosts_job_katello_errata_install_failed.event.foreman" or
        event.payload.event_name == "actions.remote_execution.run_host_job_katello_errata_install_failed.event.foreman"
      action:
        run_job_template:
          name: "FSI - Critical Finding Notification"
          organization: "Default"

    - name: Trigger verification after successful errata install
      condition: >-
        event.payload.event_name == "actions.remote_execution.run_hosts_job_katello_errata_install_succeeded.event.foreman" or
        event.payload.event_name == "actions.remote_execution.run_host_job_katello_errata_install_succeeded.event.foreman"
      action:
        run_job_template:
          name: "FSI - Verify Errata Remediation"
          organization: "Default"
