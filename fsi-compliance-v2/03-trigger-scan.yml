---
# v3 -- CONFIRMED WORKING via live Satellite MCP server query against this
# instance's actual /api/remote_execution_features and /api/job_templates/196.
# No more dynamic discovery or guessing -- this is the real, verified call.
#
# Verified facts:
#   - feature "foreman_openscap_run_scans" maps to job_template_id 196
#     ("Run OpenSCAP scans")
#   - That template has NO template_inputs -- it takes no policy parameter.
#     It iterates EVERY policy already assigned to each targeted host and
#     runs `foreman_scap_client <policy_id>` once per assigned policy.
#   - This means: if a hostgroup has multiple policies assigned, triggering
#     this feature runs ALL of them per host in that hostgroup -- there is
#     no way to selectively run just one policy via this feature.
#   - A host with ZERO policies assigned will raise an error, not silently
#     skip.
#   - job_invocations POST needs targeting_type + search_query; job_template_id
#     is optional and gets resolved automatically from "feature".

- name: Trigger an on-demand OpenSCAP compliance scan (verified job_invocations call)
  hosts: localhost
  gather_facts: false
  vars:
    satellite_url: "https://ip-10-0-1-135.us-east-2.compute.internal"
    # target_search: a Satellite host search string, e.g.:
    #   'hostgroup = fsi-corebanking-rhel9'
    #   'name = core-banking-ledger-01'
    # REQUIRED, no default -- forces a deliberate target.
    #
    # targeting_type: "static_query" (default) locks the host list at
    # submission time. Use "dynamic_query" for a recurring/scheduled job
    # where you want the host list re-evaluated each run.
    targeting_type: "{{ targeting_type | default('static_query') }}"

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - target_search is defined
        fail_msg: "This playbook needs: target_search (a Satellite host search string, e.g. 'hostgroup = fsi-corebanking-rhel9')"

    - name: Warn if targeting a hostgroup with multiple policies assigned
      ansible.builtin.debug:
        msg: >-
          NOTE: this triggers ALL policies assigned to matched hosts, not a
          single policy -- there is no per-policy selection on this feature.
          If a targeted hostgroup has multiple policies assigned, all of them
          run. Confirm that's intended before proceeding.

    - name: Trigger the OpenSCAP scan job
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/job_invocations"
        method: POST
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          job_invocation:
            feature: "foreman_openscap_run_scans"
            targeting_type: "{{ targeting_type }}"
            search_query: "{{ target_search }}"
        status_code: [200, 201]
      register: scan_job

    - name: Confirm
      ansible.builtin.debug:
        msg: >-
          Triggered OpenSCAP scan (feature: foreman_openscap_run_scans,
          job_template_id 196) against '{{ target_search }}'.
          Job invocation id: {{ scan_job.json.id | default('see Satellite UI for status') }}.
          Scans take a few minutes -- check Hosts -> [host] -> Compliance
          before running the ARF-parsing playbook.
