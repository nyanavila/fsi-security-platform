---
# 08-apply-errata.yml
#
# Tier 3 (bounded execution). Applies specific errata via Satellite's
# confirmed katello_errata_install feature (job_template_id 206).
#
# CONFIRMED input format (verified live against the actual template body,
# not guessed): a SINGLE comma-separated STRING of advisory IDs -- e.g.
# "RHSA-2024:1234,RHBA-2024:5678" -- NOT a JSON list, NOT CVE numbers.
# The template does `input(:errata).split(',').map {|e| "--advisory=#{e}"}`
# then runs `dnf update-minimal --advisory=<ids>`. Passing a JSON array or
# CVE numbers here would silently fail or do nothing useful.
#
# This playbook is designed to run AFTER 07-check-errata.yml has produced
# /tmp/errata_check_<host>.json, and after a human/EDA decision about which
# severity tier to act on (per the three-stage lifecycle design's approval
# branching). It does NOT decide policy itself -- it takes an explicit
# errata_severity_filter var telling it which tier to apply.

- name: Apply specific errata to a host (post-approval, Tier 3)
  hosts: all
  gather_facts: false
  vars:
    satellite_url: "https://ip-10-0-1-135.us-east-2.compute.internal"
    # errata_severity_filter: which severity tier(s) to apply from the
    # 07 report -- e.g. "critical,important" or just "low". REQUIRED.
    # This is the human/EDA approval decision made concrete as an input,
    # not something this playbook decides on its own.

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - errata_severity_filter is defined
        fail_msg: "This playbook needs: errata_severity_filter (e.g. 'critical,important')"

    - name: Look up this host's Satellite host ID
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/hosts?search=name%3D%22{{ inventory_hostname }}%22"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: host_lookup
      delegate_to: localhost

    - name: Skip if host not found in Satellite
      ansible.builtin.meta: end_host
      when: host_lookup.json.results | length == 0

    - name: Set the host id fact
      ansible.builtin.set_fact:
        satellite_host_id: "{{ host_lookup.json.results[0].id }}"

    - name: Re-query applicable errata directly (self-sufficient -- does NOT
        depend on 07's output file, since AAP job runs are ephemeral
        containers and files don't persist between separate job launches)
      # FIXED: bare call defaulted to per_page=20, sorted by updated desc --
      # CONFIRMED this caused a real missed remediation on ip-10-0-2-44:
      # the 14 real security errata (older updated_at) fell past page 1,
      # entirely invisible to this task, while only bugfix/enhancement
      # entries (more recently updated) came back in the truncated page.
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/hosts/{{ satellite_host_id }}/errata?per_page=200"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: errata_result

    - name: Warn loudly if even 200 isn't enough to capture everything
      ansible.builtin.debug:
        msg: >-
          WARNING: this host has {{ errata_result.json.total }} total
          applicable errata, exceeding the per_page=200 fetched here.
          Results are STILL TRUNCATED -- do not trust advisories_to_apply
          below until this is fixed with real pagination.
      when: errata_result.json.total | default(0) | int > 200

    - name: Set errata facts, categorized by severity
      ansible.builtin.set_fact:
        all_errata: "{{ errata_result.json.results | default([]) }}"
        security_errata: "{{ errata_result.json.results | default([]) | selectattr('type', 'equalto', 'security') | list }}"

    - name: Categorise SECURITY errata by severity level
      ansible.builtin.set_fact:
        critical_errata_ids: "{{ security_errata | selectattr('severity', 'equalto', 'Critical') | map(attribute='errata_id') | list }}"
        important_errata_ids: "{{ security_errata | selectattr('severity', 'equalto', 'Important') | map(attribute='errata_id') | list }}"
        moderate_errata_ids: "{{ security_errata | selectattr('severity', 'equalto', 'Moderate') | map(attribute='errata_id') | list }}"
        low_errata_ids: "{{ security_errata | selectattr('severity', 'equalto', 'Low') | map(attribute='errata_id') | list }}"

    - name: Build the list of advisory IDs to apply, based on the approved severity tiers
      ansible.builtin.set_fact:
        advisories_to_apply: >-
          {{
            (critical_errata_ids if 'critical' in errata_severity_filter.split(',') else [])
            + (important_errata_ids if 'important' in errata_severity_filter.split(',') else [])
            + (moderate_errata_ids if 'moderate' in errata_severity_filter.split(',') else [])
            + (low_errata_ids if 'low' in errata_severity_filter.split(',') else [])
          }}

    - name: Skip if nothing to apply
      ansible.builtin.meta: end_host
      when: advisories_to_apply | length == 0

    - name: Show what's about to be applied
      ansible.builtin.debug:
        msg: "About to apply {{ advisories_to_apply | length }} advisories to {{ inventory_hostname }}: {{ advisories_to_apply }}"

    - name: Trigger errata installation via Satellite (CONFIRMED feature + input format)
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/job_invocations"
        method: POST
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          job_invocation:
            feature: "katello_errata_install"
            targeting_type: "static_query"
            search_query: "name = {{ inventory_hostname }}"
            inputs:
              errata: "{{ advisories_to_apply | join(',') }}"
        status_code: [200, 201]
      register: errata_job

    - name: Record what was applied as a durable Satellite host parameter
      # NOT YET LIVE-VERIFIED against this Satellite version's exact API --
      # this is the standard, documented Foreman host-parameters pattern.
      # Confirm via MCP before relying on this in production: ask it to
      # check the real params for POST /api/hosts/:id/parameters.
      # Purpose: 09-verify-errata-remediation.yml can read this back
      # directly from Satellite instead of needing a human to re-type the
      # advisory list into a Survey field -- fixes the "ephemeral /tmp,
      # manual re-entry" gap flagged in SURVEYS.md.
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/hosts/{{ satellite_host_id }}/parameters"
        method: POST
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          parameter:
            name: "fsi_last_applied_errata"
            value: "{{ advisories_to_apply | join(',') }}"
        status_code: [200, 201, 422]  # 422 tolerated: parameter may already exist, needs PUT instead -- see note
      register: param_write_result
      delegate_to: localhost
      ignore_errors: true  # do not fail the whole remediation job over this recording step

    - name: Warn if the durable-record write failed (remediation itself still succeeded)
      ansible.builtin.debug:
        msg: >-
          NOTE: recording the applied-errata list as a Satellite host
          parameter did not succeed (status {{ param_write_result.status | default('unknown') }}).
          The actual errata install above still completed -- this only
          affects whether 09-verify-errata-remediation.yml can auto-discover
          what was applied. Fall back to passing previously_applied_errata
          manually to 09, or fix this write (may need PUT instead of POST
          if the parameter already exists from a prior run).
      when: param_write_result.status | default(0) not in [200, 201]

    - name: Confirm
      ansible.builtin.debug:
        msg: >-
          Triggered errata install (feature: katello_errata_install,
          job_template_id 206) against {{ inventory_hostname }} for
          advisories: {{ advisories_to_apply | join(',') }}.
          Job invocation id: {{ errata_job.json.id | default('see Satellite UI') }}
