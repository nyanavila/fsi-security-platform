---
# 09-verify-errata-remediation.yml (v2 -- simplified, robust design)
#
# REPLACES the v1 design, which compared a manually-provided or
# host-parameter-auto-discovered list of specific advisory IDs against
# current applicable errata. CONFIRMED via live query today: the
# fsi_last_applied_errata host parameter write in 08-apply-errata.yml
# never actually worked (verified: does not exist on any host, host or
# inherited scope) -- so that auto-discovery path was silently dead the
# whole time, and the manual fallback required a human to correctly
# re-type the exact advisory batch every single verification run.
#
# THE SIMPLER, CONFIRMED-ROBUST FIX: don't track "did these SPECIFIC
# advisories get resolved" at all. Just check "does this host currently
# have ZERO applicable security errata." This is what actually matters
# for the security posture question, it needs no tracking mechanism, no
# host parameter, no human re-entry -- and it was validated live today:
# querying a host's errata_counts.security field directly gave an
# immediate, clear, correct answer (0, down from 46) with zero setup.
#
# Trade-off, stated honestly: this reports "still has known security
# errata outstanding" vs "fully caught up on security errata" -- it does
# NOT report on the fate of one specific historical batch. If you
# genuinely need "did batch X specifically get resolved" (e.g. for an
# audit trail of one remediation event), that needs a different,
# purpose-built tracking mechanism -- this playbook answers the more
# common and more actionable question instead.

- name: Verify security errata status per host
  hosts: all
  gather_facts: false
  vars:
    satellite_url: "https://ip-10-0-1-135.us-east-2.compute.internal"

  tasks:
    - name: Look up this host's Satellite host ID
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/hosts?search=name%3D%22{{ inventory_hostname }}%22"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: host_lookup
      delegate_to: localhost

    - name: Skip if host not found
      ansible.builtin.meta: end_host
      when: host_lookup.json.results | length == 0

    - name: Get current errata counts for this host
      ansible.builtin.uri:
        url: "{{ satellite_url }}/api/hosts/{{ host_lookup.json.results[0].id }}"
        method: GET
        user: "{{ satellite_user }}"
        password: "{{ satellite_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: host_detail

    - name: Set errata count facts
      # CONFIRMED live: content_facet_attributes.errata_counts.security is
      # the correct, real path -- verified against an actual host record.
      ansible.builtin.set_fact:
        security_errata_count: "{{ host_detail.json.content_facet_attributes.errata_counts.security | default(0) }}"
        bugfix_errata_count: "{{ host_detail.json.content_facet_attributes.errata_counts.bugfix | default(0) }}"
        total_errata_count: "{{ host_detail.json.content_facet_attributes.errata_counts.total | default(0) }}"

    - name: Build per-host verification report
      ansible.builtin.set_fact:
        host_errata_report:
          host: "{{ inventory_hostname }}"
          satellite_host_id: "{{ host_lookup.json.results[0].id }}"
          checked_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          security_errata_remaining: "{{ security_errata_count }}"
          bugfix_errata_remaining: "{{ bugfix_errata_count }}"
          total_errata_remaining: "{{ total_errata_count }}"
          status: >-
            {{
              'CLEAN -- NO SECURITY ERRATA OUTSTANDING'
              if security_errata_count | int == 0
              else 'SECURITY ERRATA STILL OUTSTANDING'
            }}

    - name: Write per-host JSON report
      ansible.builtin.copy:
        content: "{{ host_errata_report | to_nice_json }}"
        dest: "/tmp/errata_verification_{{ inventory_hostname }}.json"
      delegate_to: localhost

    - name: Display summary
      ansible.builtin.debug:
        msg:
          - "HOST: {{ inventory_hostname }}"
          - "STATUS: {{ host_errata_report.status }}"
          - "Security errata remaining: {{ security_errata_count }}"
          - "Bugfix errata remaining (informational, not security-relevant): {{ bugfix_errata_count }}"

- name: Combine into fleet-wide security errata status deliverable
  hosts: localhost
  gather_facts: true
  vars:
    all_host_reports: []

  tasks:
    - name: Find all per-host errata verification reports from this run
      ansible.builtin.find:
        paths: /tmp
        patterns: "errata_verification_*.json"
        age: "-1h"
      register: report_files

    - name: Load each report
      ansible.builtin.set_fact:
        all_host_reports: "{{ all_host_reports + [ (lookup('file', item.path) | from_json) ] }}"
      loop: "{{ report_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Build fleet-wide summary
      ansible.builtin.set_fact:
        fleet_summary:
          generated_at: "{{ ansible_date_time.iso8601 }}"
          hosts_checked: "{{ all_host_reports | length }}"
          hosts_clean: "{{ all_host_reports | selectattr('status', 'equalto', 'CLEAN -- NO SECURITY ERRATA OUTSTANDING') | list | length }}"
          hosts_with_security_errata: "{{ all_host_reports | selectattr('status', 'equalto', 'SECURITY ERRATA STILL OUTSTANDING') | list | length }}"
          total_security_errata_outstanding_fleet_wide: "{{ all_host_reports | sum(attribute='security_errata_remaining') }}"
          overall_status: >-
            {{
              'SUCCESS -- FLEET HAS ZERO OUTSTANDING SECURITY ERRATA'
              if (all_host_reports | selectattr('status', 'equalto', 'SECURITY ERRATA STILL OUTSTANDING') | list | length) == 0
              else 'ATTENTION -- SOME HOSTS HAVE OUTSTANDING SECURITY ERRATA'
            }}
          hosts: "{{ all_host_reports }}"

    - name: Write final fleet-wide deliverable
      ansible.builtin.copy:
        content: "{{ fleet_summary | to_nice_json }}"
        dest: "/tmp/fsi_security_errata_status_{{ ansible_date_time.date }}.json"

    - name: Display final summary
      ansible.builtin.debug:
        msg:
          - "=== FLEET-WIDE SECURITY ERRATA STATUS ==="
          - "{{ fleet_summary.overall_status }}"
          - "Hosts checked: {{ fleet_summary.hosts_checked }}"
          - "Hosts clean: {{ fleet_summary.hosts_clean }}"
          - "Hosts with outstanding security errata: {{ fleet_summary.hosts_with_security_errata }}"
          - "Full deliverable: /tmp/fsi_security_errata_status_{{ ansible_date_time.date }}.json"
